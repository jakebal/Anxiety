<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anxiety</title>
    <style>
      @font-face {
        font-family: 'Abaddon Bold';
        src: url('/Abaddon%20Bold.ttf') format('truetype');
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        opacity: 0;
        background: radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0) 35%,
          rgba(20, 0, 0, 0.65) 75%,
          rgba(120, 0, 0, 0.95) 100%
        );
      }
      #anxiety-hud {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        pointer-events: none;
        user-select: none;
        font-family: 'Abaddon Bold', sans-serif;
        color: #ffffff;
        z-index: 10;
      }
      #anxiety-portrait {
        width: 128px;
        height: 128px;
        image-rendering: pixelated;
        flex-shrink: 0;
      }
      #anxiety-label {
        font-size: 20px;
        letter-spacing: 1px;
        margin-bottom: 6px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      }
      #anxiety-track,
      #potty-track {
        width: 220px;
        height: 18px;
        box-sizing: border-box;
      }
      #anxiety-fill,
      #potty-fill {
        width: 0%;
        height: 100%;
        --bar-color: #ffffff;
        background: repeating-linear-gradient(
          to right,
          var(--bar-color) 0 8px,
          transparent 8px 13px
        );
        transition: background-color 0.15s ease;
      }
      #potty-label {
        font-size: 20px;
        letter-spacing: 1px;
        margin-top: 12px;
        margin-bottom: 6px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      }
      #death-screen {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.92);
        transition: background-color 0.8s ease;
        color: #ff3b3b;
        font-family: 'Abaddon Bold', sans-serif;
        text-align: center;
        user-select: none;
        z-index: 20;
      }
      #death-title {
        font-size: 42px;
        letter-spacing: 2px;
        margin-bottom: 18px;
      }
      #death-sub {
        font-size: 20px;
        color: #ffffff;
        opacity: 0.85;
      }
      #event-log {
        position: fixed;
        bottom: 20px;
        left: 24px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 420px;
        pointer-events: none;
        user-select: none;
        font-family: 'Abaddon Bold', sans-serif;
        font-size: 16px;
        letter-spacing: 0.5px;
        z-index: 10;
      }
      .event-log-entry {
        color: #e6e6e6;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
        transition: opacity 0.6s ease;
      }
      #fade-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 15;
        transition: opacity 0.6s ease;
      }
    </style>
  </head>
  <body>
    <div id="vignette"></div>
    <div id="anxiety-hud">
      <img id="anxiety-portrait" src="/portrait-1.png" alt="Player portrait" />
      <div id="anxiety-meters">
        <div id="anxiety-label">ANXIETY</div>
        <div id="anxiety-track">
          <div id="anxiety-fill"></div>
        </div>
        <div id="potty-label">POTTY</div>
        <div id="potty-track">
          <div id="potty-fill"></div>
        </div>
      </div>
    </div>
    <div id="event-log"></div>
    <div id="fade-overlay"></div>
    <div id="death-screen">
      <div id="death-title">You had a panic attack...</div>
      <div id="death-sub">Press any key to continue</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
